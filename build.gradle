plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.nucleoid.xyz' }
    maven { url "https://api.modrinth.com/maven/" }
    maven { url = "https://repo.codemc.io/repository/relativitymc/" }
}

loom {
    useIntermediateMappings = true
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation ("eu.pb4:polymer-core:[${polymer_version}]")
    modImplementation ("eu.pb4:polymer-blocks:[${polymer_version}]")
    modImplementation ("eu.pb4:polymer-resource-pack:[${polymer_version}]")
    modImplementation ("eu.pb4:polymer-virtual-entity:[${polymer_version}]")
    modImplementation ("eu.pb4:polymer-autohost:${polymer_version}")
    modImplementation ("eu.pb4:polymer-resource-pack-extras:[${polymer_version}]")
    modImplementation include ("eu.pb4:factorytools:[${factorytools_version}]")

    modCompileOnly ("maven.modrinth:rustic-delight:[${rusticdelight_version}]")
    modImplementation ("maven.modrinth:farmers-delight-refabricated:[${farmersdelight_version}]")
}

loom {
    useIntermediateMappings = true
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {}
}